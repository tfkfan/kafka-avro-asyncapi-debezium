asyncapi: "3.0.0"
info:
  title: Payment Service
  version: 1.0.0
  tags:
    - name: "Default"
    - name: "Payments"

channels:
  Payments:
    address: "payments-topic"
    messages:
      PaymentMessage:
        payload:
          schemaFormat: "application/vnd.apache.avro;version=1.9.0"
          $ref: './avro/payment.avsc'

operations:
  onPaymentCreated:
    action: send
    tags:
      - name: Payments
    channel:
      $ref: '#/channels/Payments'
    messages:
      - $ref: '#/channels/Payments/messages/PaymentMessage'
  onPaymentReceived:
    action: receive
    tags:
      - name: Payments
    channel:
      $ref: '#/channels/Payments'
    messages:
      - $ref: '#/channels/Payments/messages/PaymentMessage'