asyncapi: "3.0.0"
info:
  title: Order Service
  version: 1.0.0
  tags:
    - name: "Default"
    - name: "Orders"

channels:
  Orders:
    address: "orders-topic"
    messages:
      OrderMessage:
        payload:
          schemaFormat: "application/vnd.apache.avro;version=1.9.0"
          $ref: './avro/order.avsc'

operations:
  onOrderCreated:
    action: send
    tags:
      - name: Orders
    channel:
      $ref: '#/channels/Orders'
    messages:
      - $ref: '#/channels/Orders/messages/OrderMessage'