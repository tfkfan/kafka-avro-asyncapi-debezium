asyncapi: "3.0.0"
info:
  title: Payment Service
  version: 1.0.0
  tags:
    - name: "Default"
    - name: "Payments"

channels:
  payments:
    messages:
      PaymentMessage:
        $ref: '#/components/messages/PaymentMessage'

operations:
  onPaymentCreated:
    action: send
    tags:
      - name: Payments
    channel:
      $ref: '#/channels/payments'
    messages:
      - $ref: '#/channels/payments/messages/PaymentMessage'

components:
  messages:
    PaymentMessage:
      payload:
        $ref: '#/components/schemas/Payment'
  schemas:
    BasePayment:
      type: object
      properties:
        createdAt:
          type: string
    Payment:
      type: object
      allOf:
        - $ref: '#/components/schemas/BasePayment'
        - type: object
          properties:
            transactionId:
              type: string
            amount:
              type: number
            some:
              type: string
      required:
        - createdAt
        - transactionId
